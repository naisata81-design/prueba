# Blueprint de Render. Debe estar en la RAÍZ del repositorio.
# Las claves marcadas "sync: false" se escriben a mano en Render → Environment (nunca en el código).
services:
  - type: web
    name: ac-control-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI        # cadena de MongoDB Atlas
        sync: false
      - key: MONGODB_DB
        value: ac-control
      - key: JWT_SECRET         # firma las sesiones de los clientes
        generateValue: true
      - key: ADMIN_TOKEN        # contraseña del panel de administración propia
        generateValue: true
      - key: DEVICE_KEY         # la MISMA que ya tienen grabada los ESP-01
        sync: false
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: POLL_SECONDS
        value: "10"
      - key: ALLOWED_ORIGIN     # https://tu-usuario.github.io (varios: separados por coma)
        sync: false
